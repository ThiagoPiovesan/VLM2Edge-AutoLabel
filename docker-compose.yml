services:
  redis:
    image: redis:7.4-alpine
    container_name: vlm2edge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    restart: unless-stopped

  # Opção A (estudo de vLLM): Qwen3-VL-4B-Instruct em AWQ 4-bit (~2.6 GB de pesos, cabe em 6 GB VRAM)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vlm2edge-vllm
    profiles: [ "vllm" ]
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    command:
      - cyankiwi/Qwen3-VL-4B-Instruct-AWQ-4bit
      - --max-model-len
      - "1536"
      - --max-num-seqs
      - "1"
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "0.82"
      - --enforce-eager
      - --limit-mm-per-prompt
      - '{"image": 1}'
      - --mm-processor-kwargs
      - '{"max_pixels": 501760}'

  # Opção B (alternativa mais leve para 6 GB VRAM): GGUF Q4_K_M via llama.cpp server
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: vlm2edge-llamacpp
    profiles: [ "gguf" ]
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    command: >
      -m /weights/Qwen3VL-4B-Instruct-Q4_K_M.gguf --mmproj /weights/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --host 0.0.0.0 --port 8000 -ngl 99 -c 4096

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: vlm2edge-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - mlflow-artifacts:/
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
    restart: unless-stopped

volumes:
  redis_data:
  mlflow_data:
