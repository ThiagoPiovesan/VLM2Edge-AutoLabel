[project]
name = "vlm2edge"
version = "0.1.0"
description = "VLM to Edge YOLO auto-labeling distillation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "redis>=5.1.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
